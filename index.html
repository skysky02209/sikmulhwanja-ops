<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="식물환자 OPS — 학교 온실 운영자를 위한 센서·측정 현황 관리 화면. 모든 수치는 UI 데모 데이터입니다.">
<title>식물환자 OPS — 온실 운영 관리</title>
<style>/* 식물환자 OPS — 온실 운영 콘솔
   자기완결형. 외부 폰트·CDN 없음. 데스크톱 우선, 768px 이하 단일 열. */

:root{
  /* 배경: 옅은 회녹색 */
  --bg:#eef2ee;
  --surface:#ffffff;
  --surface-2:#f6f8f6;
  --line:#dae1dc;
  --line-strong:#c3ccc5;

  /* 짙은 숲 녹색 — 내비게이션·현황 패널 */
  --forest:#12301f;
  --forest-2:#1a4130;
  --forest-line:#2c5a42;
  --on-forest:#eaf2ec;
  --on-forest-dim:#9db8a8;

  --text:#16211a;
  --muted:#5a6b60;

  /* 상태색 — 대비 확보 */
  --ok:#1d6f42;      --ok-bg:#e6f2ea;
  --info:#1f5f74;    --info-bg:#e5f0f4;
  --warn:#8a5200;    --warn-bg:#fdf1de;
  --alert:#9a4a00;   --alert-bg:#fdeede;
  --error:#a3231b;   --error-bg:#fbeae9;

  --radius:12px;
  --shadow:0 1px 2px rgba(18,48,31,.06), 0 6px 20px rgba(18,48,31,.05);
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1512; --surface:#141d18; --surface-2:#18221d;
    --line:#25332b; --line-strong:#33453a;
    --forest:#0c2215; --forest-2:#123020; --forest-line:#1f4732;
    --text:#e6efe9; --muted:#93a89a;
    --ok:#5fc78c; --ok-bg:#12291d;
    --info:#69bcd6; --info-bg:#0f2830;
    --warn:#e0a33c; --warn-bg:#2c2110;
    --alert:#e59356; --alert-bg:#2e1e11;
    --error:#f08a82; --error-bg:#301715;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  }
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",
       system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px 64px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0,0,0,0);white-space:nowrap;border:0}
.muted{color:var(--muted)} .small{font-size:13px}
.ico{flex:none;vertical-align:-2px}

:focus-visible{outline:3px solid var(--ok);outline-offset:2px;border-radius:6px}

/* ================= 내비게이션 ================= */
.nav{background:var(--forest);color:var(--on-forest);position:sticky;top:0;z-index:40}
.nav-inner{max-width:1240px;margin:0 auto;padding:0 24px;height:64px;
  display:flex;align-items:center;gap:28px}
.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;
  font-size:16px;letter-spacing:-.01em;white-space:nowrap}
.brand-mark{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;
  background:rgba(255,255,255,.1);color:#8fd6a8}
.brand-text b{font-weight:800;letter-spacing:.04em}
.nav-menu{display:flex;gap:4px;margin-left:8px}
.nav-link{color:var(--on-forest-dim);text-decoration:none;font-size:14px;
  padding:8px 13px;border-radius:8px;white-space:nowrap}
.nav-link:hover{color:var(--on-forest);background:rgba(255,255,255,.07)}
.nav-link.is-current{color:#fff;background:rgba(255,255,255,.12);font-weight:600}
.nav-actions{margin-left:auto;display:flex;align-items:center;gap:8px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:40px;padding:0 15px;border-radius:9px;border:1px solid transparent;
  font:inherit;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none}
.btn-solid{background:#2f8f5b;color:#fff}
.btn-solid:hover{background:#268050}
.btn-icon{min-width:40px;padding:0 8px;background:rgba(255,255,255,.1);
  color:var(--on-forest);display:none}
.nav-toggle{display:none}

/* ================= 히어로 ================= */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:36px;align-items:center;
  padding:52px 0 36px}
.eyebrow{margin:0 0 12px;font-size:11.5px;font-weight:700;letter-spacing:.16em;
  color:var(--ok)}
.hero h1{margin:0 0 14px;font-size:44px;line-height:1.16;letter-spacing:-.025em;
  font-weight:800}
.lede{margin:0 0 22px;font-size:16px;color:var(--muted);max-width:44ch}
.btn-cta{background:var(--forest);color:#fff;min-height:46px;padding:0 20px;font-size:15px}
.btn-cta:hover{background:var(--forest-2)}
.disclaimer{display:flex;gap:8px;margin:22px 0 0;padding:11px 14px;font-size:13px;
  line-height:1.55;color:var(--muted);background:var(--surface);
  border:1px solid var(--line);border-radius:10px;max-width:52ch}
.disclaimer .ico{margin-top:3px;color:var(--info)}

/* 현황 패널 */
.panel{background:var(--forest);color:var(--on-forest);border-radius:16px;
  padding:24px 24px 20px;box-shadow:var(--shadow)}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin-bottom:16px}
.panel-head h2{margin:0;font-size:15px;font-weight:600;color:#fff}
.demo-tag{font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 9px;
  border-radius:99px;background:rgba(255,255,255,.14);color:#cfe6d7;white-space:nowrap}
.demo-tag-light{background:var(--warn-bg);color:var(--warn)}
.panel-figure{margin:0 0 12px;display:flex;align-items:baseline;gap:10px}
.figure-main{font-size:40px;font-weight:800;letter-spacing:-.03em;color:#fff;
  font-variant-numeric:tabular-nums}
.figure-label{font-size:13px;color:var(--on-forest-dim)}
.panel-bar{height:7px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;
  margin-bottom:20px}
.panel-bar span{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,#4fb87c,#8fd6a8)}

.status-grid{list-style:none;margin:0;padding:0;display:grid;
  grid-template-columns:repeat(2,1fr);gap:10px}
.status-card{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;
  gap:0 10px;align-items:center;padding:12px 13px;border-radius:11px;
  background:rgba(255,255,255,.07);border:1px solid var(--forest-line)}
.status-ico{grid-row:1/3;display:grid;place-items:center;width:30px;height:30px;
  border-radius:8px;background:rgba(255,255,255,.1)}
.status-count{font-size:20px;font-weight:800;line-height:1.1;color:#fff;
  font-variant-numeric:tabular-nums}
.status-label{font-size:12px;color:var(--on-forest-dim)}
.status-card.tone-alert .status-ico{color:#f0a868}
.status-card.tone-warn  .status-ico{color:#f2c14e}
.status-card.tone-error .status-ico{color:#f08a82}
.status-card.tone-info  .status-ico{color:#7fc6dd}
.panel-note{margin:16px 0 0;font-size:12px;color:var(--on-forest-dim);line-height:1.5}

/* ================= 요약 지표 ================= */
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:8px}
.metric{display:flex;gap:13px;align-items:flex-start;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;
  box-shadow:var(--shadow)}
.metric-ico{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;
  background:var(--ok-bg);color:var(--ok);flex:none}
.metric-value{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;line-height:1.2}
.metric-label{margin:1px 0 0;font-size:13px;font-weight:600}
.metric-hint{margin:2px 0 0;font-size:12px;color:var(--muted)}

/* ================= 섹션 공통 ================= */
.section-head{margin:40px 0 14px}
.section-head h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.015em}
.section-head h3{margin:0;font-size:15px;font-weight:700}
.section-sub{margin:5px 0 0;font-size:13px;color:var(--muted);max-width:70ch}

/* ================= 배지 ================= */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;
  font-size:12.5px;font-weight:600;white-space:nowrap;
  border:1px solid transparent;line-height:1.5}
.badge-sign{font-size:11px;line-height:1}
.badge.tone-ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.badge.tone-info{background:var(--info-bg);color:var(--info);border-color:var(--info)}
.badge.tone-warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.badge.tone-alert{background:var(--alert-bg);color:var(--alert);border-color:var(--alert)}
.badge.tone-error{background:var(--error-bg);color:var(--error);border-color:var(--error)}
.badge-sub{margin-left:5px;font-size:11.5px;padding:2px 8px}
.badge-status{font-size:13px}

/* ================= 테이블 ================= */
.table-wrap{background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);overflow-x:auto;box-shadow:var(--shadow)}
.ops-table{width:100%;border-collapse:collapse;min-width:1020px;font-size:14px}
.ops-table thead th{position:sticky;top:0;background:var(--surface-2);
  text-align:left;font-size:12px;font-weight:700;color:var(--muted);
  letter-spacing:.02em;padding:12px 14px;border-bottom:1px solid var(--line-strong);
  white-space:nowrap}
.ops-table td,.ops-table th[scope=row]{padding:14px;border-bottom:1px solid var(--line);
  vertical-align:top;text-align:left}
.ops-table tbody tr:last-child td,
.ops-table tbody tr:last-child th{border-bottom:none}
.ops-table tbody tr:hover{background:var(--surface-2)}
.row-attention{background:var(--error-bg)}
.row-attention:hover{background:var(--error-bg)}

.plant-name{display:block;font-weight:700}
.plant-id{display:block;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.cell-zone,.cell-time{color:var(--muted);white-space:nowrap}
.cell-time time{font-variant-numeric:tabular-nums}
.cell-status{min-width:210px}
.cell-note{display:block;margin-top:5px;font-size:12px;color:var(--muted);line-height:1.45}
.cell-action{max-width:190px;line-height:1.45}
.cell-us{white-space:nowrap}
.us-main{display:block;font-weight:700;font-variant-numeric:tabular-nums}
.us-unit{font-size:11px;font-weight:500;color:var(--muted);margin-left:3px}
.us-sub{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}

/* 모바일 카드 (기본 숨김) */
.pcards{display:none;gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow);border-left-width:4px}
.tone-edge-ok{border-left-color:var(--ok)}
.tone-edge-info{border-left-color:var(--info)}
.tone-edge-warn{border-left-color:var(--warn)}
.tone-edge-error{border-left-color:var(--error)}
.pcard-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pcard-head p{margin:0}
.pcard-time{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pcard-status{margin:12px 0 0}
.pcard-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0 0}
.pcard-grid dt{font-size:11.5px;color:var(--muted);margin-bottom:4px}
.pcard-grid dd{margin:0;font-size:13.5px;font-weight:600}
.pcard-action{margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line);
  font-size:13.5px}
.pcard-action b{color:var(--muted);font-size:12px;margin-right:6px}

/* ================= 알림 + 추세 ================= */
.alerts{display:grid;grid-template-columns:1.15fr .85fr;gap:20px;align-items:start}
.alert-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.alert-item{display:flex;gap:13px;align-items:flex-start;background:var(--surface);
  border:1px solid var(--line);border-left-width:4px;border-radius:var(--radius);
  padding:15px 17px;box-shadow:var(--shadow)}
.alert-item.tone-alert{border-left-color:var(--alert)}
.alert-item.tone-warn{border-left-color:var(--warn)}
.alert-item.tone-info{border-left-color:var(--info)}
.alert-ico{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;flex:none}
.tone-alert .alert-ico{background:var(--alert-bg);color:var(--alert)}
.tone-warn .alert-ico{background:var(--warn-bg);color:var(--warn)}
.tone-info .alert-ico{background:var(--info-bg);color:var(--info)}
.alert-label{margin:0;font-weight:700;display:flex;align-items:baseline;gap:9px}
.alert-count{font-size:13px;font-weight:700;color:var(--muted);
  font-variant-numeric:tabular-nums}
.alert-hint{margin:3px 0 0;font-size:13px;color:var(--muted);line-height:1.5}
.alerts-foot{display:flex;gap:8px;margin:14px 0 0;font-size:12.5px;color:var(--muted);
  line-height:1.55}
.alerts-foot .ico{margin-top:3px;flex:none;color:var(--info)}

.trend{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;box-shadow:var(--shadow);margin-top:40px}
.trend-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 10px}
.trend-svg{width:100%;height:auto;display:block}
.trend-svg .bar{fill:var(--ok);opacity:.85}
.trend-svg .bar:hover{opacity:1}
.trend-svg .axis{font-size:9px;fill:var(--muted)}
.trend-svg .axis-line{stroke:var(--line-strong);stroke-width:1}
.trend-note{margin:10px 0 0;font-size:11.5px;color:var(--muted);line-height:1.5}

/* ================= 상태 화면 ================= */
.state{display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:64px 24px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius);margin-top:40px}
.state-error{border-color:var(--error);background:var(--error-bg)}
.state-ico{color:var(--muted);margin-bottom:14px}
.state-error .state-ico{color:var(--error)}
.state-title{margin:0;font-size:17px;font-weight:700}
.state-sub{margin:7px 0 0;font-size:14px;color:var(--muted);line-height:1.6}
.state .btn{margin-top:20px}
.spinner{width:32px;height:32px;border-radius:50%;margin-bottom:16px;
  border:3px solid var(--line);border-top-color:var(--ok);
  animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.skeleton-list{display:grid;gap:10px;width:100%;max-width:640px;margin-top:26px}
.skeleton{height:46px;border-radius:10px;
  background:linear-gradient(90deg,var(--surface-2) 25%,var(--line) 37%,var(--surface-2) 63%);
  background-size:400% 100%;animation:shimmer 1.4s ease infinite}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
@media (prefers-reduced-motion:reduce){
  .spinner,.skeleton{animation:none}
}

.report-note{margin-top:24px;padding:14px 16px;background:var(--info-bg);color:var(--info);
  border-radius:10px;font-size:13.5px;line-height:1.55}

/* ================= 푸터 ================= */
.foot{max-width:1240px;margin:0 auto;padding:26px 24px 44px;border-top:1px solid var(--line)}
.foot p{margin:0 0 6px;font-size:13px;color:var(--muted);line-height:1.6}
.foot b{color:var(--text)}

/* ================= 반응형 ================= */
@media (max-width:1080px){
  .hero{grid-template-columns:1fr;gap:28px;padding:36px 0 28px}
  .hero h1{font-size:36px}
  .alerts{grid-template-columns:1fr}
  .trend{margin-top:8px}
}

@media (max-width:768px){
  .wrap{padding:0 16px 48px}
  .nav-inner{padding:0 16px;height:58px;gap:12px}
  .nav-toggle{display:inline-flex}
  .nav-menu{position:absolute;top:58px;left:0;right:0;display:none;flex-direction:column;
    gap:2px;background:var(--forest-2);padding:10px 16px 14px;
    border-bottom:1px solid var(--forest-line);margin:0}
  .nav-menu.is-open{display:flex}
  .nav-link{padding:12px 13px;min-height:44px;display:flex;align-items:center}
  #btnReport span{display:none}
  #btnReport{min-width:40px;padding:0 10px}

  .hero{padding:26px 0 20px}
  .hero h1{font-size:29px}
  .lede{font-size:15px}
  .panel{padding:18px}
  .figure-main{font-size:32px}
  .status-grid{grid-template-columns:1fr 1fr}

  .metrics{grid-template-columns:1fr}
  .section-head{margin:30px 0 12px}

  /* 운영 표만 카드로 전환한다. 검증 표(.val-table)는 가로 스크롤로 유지 —
     여기서 통째로 숨기면 모바일에서 실측 수치가 사라진다. */
  .board .table-wrap{display:none}
  .pcards{display:grid}
  .validation .table-wrap{display:block}
  .pcard-grid{grid-template-columns:1fr}

  .state{padding:44px 18px}
}

@media (max-width:380px){
  .status-grid{grid-template-columns:1fr}
}

@media print{
  .nav,.btn,.trend{display:none}
  body{background:#fff}
}

/* ================= 검증 현황 (실측) ================= */
.validation{margin-top:44px;padding-top:32px;border-top:2px solid var(--line-strong)}
.validation h3{margin:28px 0 10px;font-size:15.5px;font-weight:700}
.validation h3:first-of-type{margin-top:20px}

.banner-inline{display:flex;gap:9px;align-items:flex-start;background:var(--info-bg);
  color:var(--info);border-radius:10px;padding:12px 15px;font-size:13px;line-height:1.6;
  margin:14px 0 4px}
.banner-inline .ico{margin-top:3px;flex:none}
.banner-inline b{color:inherit}

.val-table{min-width:560px}
.val-table th[scope=row]{font-weight:700}
.val-table .plant-id{font-weight:400}

.spec-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:10px;margin:12px 0}
.kv-accent{border-color:var(--ok);background:var(--ok-bg)}
.kv-accent .v{color:var(--ok)}

.curve{width:100%;height:auto;display:block}
.curve .curve-line{fill:none;stroke:var(--ok);stroke-width:2.2;
  stroke-linejoin:round;stroke-linecap:round}
.curve .curve-area{fill:var(--ok);opacity:.12;stroke:none}
.curve .pt{fill:var(--ok)}
.curve .grid{stroke:var(--line);stroke-width:1}
.curve .ref{stroke:var(--warn);stroke-width:1.2;stroke-dasharray:5 4;opacity:.8}
.curve .axis{font-size:9.5px;fill:var(--muted)}

.vstack{display:grid;gap:10px;margin-top:12px}
.vcard{background:var(--surface);border:1px solid var(--line);border-left-width:4px;
  border-radius:var(--radius);padding:14px 17px;box-shadow:var(--shadow)}
.vcard.tone-ok{border-left-color:var(--ok)}
.vcard.tone-warn{border-left-color:var(--warn)}
.vcard.tone-error{border-left-color:var(--error)}
.vcard-title{display:flex;align-items:center;gap:7px;margin:0 0 6px;
  font-weight:700;font-size:14px}
.vcard.tone-ok .vcard-title{color:var(--ok)}
.vcard.tone-warn .vcard-title{color:var(--warn)}
.vcard.tone-error .vcard-title{color:var(--error)}
.vlist{margin:0;padding-left:19px;font-size:13.5px;line-height:1.65}
.vlist li{margin:4px 0}

@media (max-width:768px){
  .validation{margin-top:32px}
  .spec-grid{grid-template-columns:1fr}
}

/* ================= 측정 화면 ================= */
.measure{display:grid;gap:14px;padding-bottom:20px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;box-shadow:var(--shadow)}
.mcard-demo{background:var(--surface-2)}
.mcard-outcome{border-left-width:4px}
.mcard-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.mcard-head h3{margin:0;font-size:15.5px;font-weight:700;flex:1;min-width:140px}
.mh4{margin:16px 0 6px;font-size:13.5px;font-weight:700;color:var(--muted)}
.msub{margin:6px 0 0;font-size:12.5px;color:var(--muted);line-height:1.6}

.kvlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:2px 18px;margin:0}
.kvlist>div{display:flex;justify-content:space-between;gap:12px;align-items:center;
  padding:7px 0;border-bottom:1px solid var(--line);min-height:38px}
.kvlist dt{font-size:12.5px;color:var(--muted);flex:none}
.kvlist dd{margin:0;font-size:13.5px;font-weight:600;text-align:right;
  font-variant-numeric:tabular-nums}
.kvlist-live dd{font-size:14.5px}

.mnotice{display:flex;gap:9px;align-items:flex-start;margin:12px 0 0;padding:11px 14px;
  border-radius:9px;font-size:13px;line-height:1.6}
.mnotice .ico{margin-top:2px;flex:none}
.mnotice.tone-info{background:var(--info-bg);color:var(--info)}
.mnotice.tone-warn{background:var(--warn-bg);color:var(--warn)}
.mnotice.tone-error{background:var(--error-bg);color:var(--error)}

.mactions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}
.mactions .msub{margin:0}

.scnrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.scnbtn{min-height:52px;text-align:left;padding:8px 12px;border-radius:9px;
  border:1px solid var(--line);background:var(--surface);color:var(--text);
  font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.scnbtn:hover{border-color:var(--ok)}
.scnbtn.is-on{border-color:var(--ok);background:var(--ok-bg)}
.scn-l{font-size:13.5px;font-weight:700}
.scn-h{font-size:11.5px;color:var(--muted)}

.checklist-ui,.gatelist{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.checklist-ui li,.gatelist li{display:flex;gap:10px;align-items:flex-start;
  padding:9px 0;border-bottom:1px solid var(--line)}
.checklist-ui li:last-child,.gatelist li:last-child{border-bottom:none}
.ck-ico{flex:none;margin-top:2px}
.pass .ck-ico{color:var(--ok)} .fail .ck-ico{color:var(--error)}
.ck-label{margin:0;font-size:13.5px;font-weight:600}
.ck-detail{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.ck-hint{margin:4px 0 0;font-size:12.5px;color:var(--warn)}
.gatelist{counter-reset:g}
.gatelist li{font-size:13.5px}
.gate-hint{flex-basis:100%;margin-left:24px;font-size:12.5px;color:var(--warn)}

.obslist,.steplist{margin:8px 0 0;padding-left:20px;font-size:13.5px;line-height:1.7}
.obslist li,.steplist li{margin:5px 0}
.layerlist{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px;font-size:13.5px}
.layerlist li{display:flex;gap:9px;align-items:center;flex-wrap:wrap;
  padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2)}
.layerlist li.fail{border-color:var(--error);background:var(--error-bg)}

.outcome-main{margin:2px 0 0;font-size:15px;font-weight:600;line-height:1.65}

.tech{margin-top:14px;border:1px solid var(--line);border-radius:9px;
  background:var(--surface-2)}
.tech summary{cursor:pointer;padding:11px 14px;font-size:13.5px;font-weight:600;
  min-height:44px;display:flex;align-items:center;gap:9px}
.tech[open] summary{border-bottom:1px solid var(--line)}
.tech>*:not(summary){padding:0 14px 12px}
.tech .scroll{padding-top:10px}
.tech-tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;
  background:var(--warn-bg);color:var(--warn)}

@media (max-width:768px){
  .kvlist{grid-template-columns:1fr}
  .scnrow{grid-template-columns:1fr 1fr}
  .measure .table-wrap{display:block}
}

/* 공유용 데모 상태 전환 바 */
.statebar{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:50;
  display:flex;align-items:center;gap:6px;padding:7px 9px;border-radius:99px;
  background:var(--forest);color:var(--on-forest);box-shadow:0 6px 24px rgba(0,0,0,.22)}

<script>/* ===== src/types.js ===== */
/**
 * 식물환자 OPS — 타입 정의 (JSDoc)
 *
 * 빌드 도구가 없는 프로젝트이므로 TypeScript 대신 JSDoc 으로 타입을 정의한다.
 * 에디터에서 동일한 자동완성·타입 검사를 받을 수 있고, 실행에는 아무 영향이 없다.

 * 데이터 품질 — 측정이 쓸 만한가. **식물 상태와 별개다.**
 * @typedef {'good'|'fair'|'low'|'error'} DataQuality
 */

/**
 * 센서 연결 상태 — 장비가 살아 있는가. **데이터 품질과 별개다.**
 * @typedef {'online'|'degraded'|'offline'} SensorState
 */

/**
 * 보정 상태 — 값의 의미를 신뢰할 수 있는가.
 * @typedef {'valid'|'due_soon'|'expired'} CalibrationState
 */

/**
 * 식물에 대한 판단. **확정 표현을 쓰지 않는다.**
 * - suspected_water_stress : 수분 스트레스 패턴 의심
 * - remeasure_required     : 재측정 필요
 * - check_recommended      : 추가 점검 권장
 * - no_signal              : 특별한 신호 없음 (건강하다는 뜻이 아니다)
 * @typedef {'suspected_water_stress'|'remeasure_required'|'check_recommended'|'no_signal'} PlantStatus
 */

/**
 * @typedef {Object} UltrasoundSummary
 * @property {number} eventsPerHour        시간당 이중마이크 확인 이벤트 수
 * @property {number} eventsTotal          검출된 후보 이벤트 수
 * @property {number} eventsConfirmed      이중 마이크 동시검출된 수
 * @property {number|null} peakFrequencyHz 평균 피크 주파수 (없으면 null)
 */

/**
 * @typedef {Object} PlantRow
 * @property {string} id                예: 'TOM-03'
 * @property {string} label             화면 표기명. 예: '토마토 #03'
 * @property {string} zone              구역. 예: '온실 A-2'
 * @property {string} lastMeasuredAt    'HH:MM'
 * @property {DataQuality} dataQuality
 * @property {SensorState} sensorState
 * @property {CalibrationState} calibration
 * @property {PlantStatus} status
 * @property {string} action            필요한 조치 (한 줄)
 * @property {UltrasoundSummary} ultrasound
 * @property {number|null} soilVwc      토양 함수량 (보정 안 되면 null)
 */

/**
 * @typedef {Object} StatusCount
 * @property {string} key
 * @property {string} label
 * @property {number} count
 * @property {'alert'|'warn'|'error'|'info'} tone
 */

/**
 * @typedef {Object} FacilitySummary
 * @property {string} facilityName        예: '온실 A'
 * @property {number} measuredOk          정상 측정 건수
 * @property {number} measuredTotal       전체 측정 건수
 * @property {StatusCount[]} statusCards
 * @property {{uptimePct:number, avgTempC:number, avgHumidityPct:number}} metrics
 */

/**
 * @typedef {Object} OpsAlertGroup
 * @property {string} key
 * @property {string} label
 * @property {number} count
 * @property {'alert'|'warn'|'info'} tone
 * @property {string} hint
 */

/**
 * @typedef {Object} TrendPoint
 * @property {string} t   시각 라벨
 * @property {number} v   시간당 이벤트 수
 */

/**
 * 데이터 계층이 돌려주는 전체 스냅샷.
 * @typedef {Object} OpsSnapshot
 * @property {FacilitySummary} facility

 */

/* ---------------------------------------------------------------- *
 * 표시 사전 — 내부 값 → 사용자 문구

/**
 * MockDeviceAdapter — 실제 BLE/USB 대신 쓰는 모의 장치.
 *
 * ★ 실제 센서 연동은 아직 구현하지 않았다 ★
 * 이 어댑터가 인터페이스를 고정해 두므로, 나중에 Web Bluetooth 또는 USB
 * 구현으로 **어댑터만 교체**하면 화면은 손대지 않아도 된다.
 *
 * 절대 하지 않는 것
 *   · 브라우저 마이크로 초음파를 직접 받지 않는다 (48 kHz 경로는 24 kHz까지만 담긴다)
 *   · 원시 초음파 파형을 웹으로 스트리밍하지 않는다 (SD 회수 또는 제한된 진단 모드)
 *
 * 웹으로 오는 것: 이벤트 수·주파수 특징·에너지·지속시간·SNR·센서 상태·환경값·버전
 */

/** @typedef {import('./measure-types.js').MeasurementSession} MeasurementSession */

const DEMO = 'DEMO';

/** 시나리오 — 화면의 모든 상태를 눌러 볼 수 있게 한다 */
const SCENARIOS = {
  normal:       { label: '정상 측정',        hint: '모든 점검 통과' },
  quality_low:  { label: '품질 낮음',        hint: '배경 잡음 높음' },
  sensor_error: { label: '센서 오류',        hint: '환경 센서 응답 없음' },
  calibration:  { label: '보정 만료',        hint: '보정 유효기간 지남' },
  out_of_scope: { label: '적용 범위 밖',     hint: '지원하지 않는 종' },
  link_fail:    { label: '연결 실패',        hint: '장치를 찾지 못함' },
};

const BASE_DEVICE = {
  deviceId: 'SHJ-SENSOR-001',
  deviceName: '식물환자 초음파 센서',
  firmwareVersion: '0.1.0',
  transport: 'Bluetooth LE',
  sampleRateHz: 192000,
  micChannels: 2,
};

function iso(offsetDays = 0) {
  const d = new Date(Date.UTC(2026, 7, 12));
  d.setUTCDate(d.getUTCDate() + offsetDays);
  return d.toISOString().slice(0, 10);
}

/**
 * @returns {{connect:Function, getStatus:Function, startSession:Function,
 *            stopSession:Function, onTick:Function}}
 */
function createMockDevice(scenario = 'normal') {
  let timer = null;
  let elapsed = 0;
  let events = [];

  const st = {
    scenario,
    link: 'disconnected',
    battery: scenario === 'sensor_error' ? 18 : 84,
    micOk: scenario !== 'sensor_error',
    envOk: scenario !== 'sensor_error',
    calibratedAt: scenario === 'calibration' ? iso(-95) : iso(-6),
    calibrationValidUntil: scenario === 'calibration' ? iso(-65) : iso(24),
    species: scenario === 'out_of_scope' ? 'Ocimum basilicum' : 'Solanum lycopersicum',
    speciesLabel: scenario === 'out_of_scope' ? '바질' : '토마토',
    plantId: scenario === 'out_of_scope' ? 'BAS-02' : 'TOM-03',
    distanceCm: 10.0,
    timeSynced: true,
    noise: scenario === 'quality_low' ? 'high' : 'low',
    ...BASE_DEVICE,
  };

  function envSnapshot() {
    if (!st.envOk) return { soilMoisture: null, temperatureC: null,
                            humidityPct: null, illuminanceLux: null };
    const t = elapsed / 60;
    return {
      soilMoisture: +(0.24 - t * 0.002).toFixed(3),
      temperatureC: +(27.1 + Math.sin(t) * 0.3).toFixed(1),
      humidityPct: +(52 - t * 0.1).toFixed(0),
      illuminanceLux: Math.round(11800 + Math.sin(t / 2) * 400),
    };
  }

  function makeEvent(i) {
    const noisy = st.noise === 'high';
    return {
      t: elapsed,
      peakFrequencyHz: Math.round(48000 + (i % 7) * 900 - (noisy ? 9000 : 0)),
      durationMs: +(noisy ? 0.62 + (i % 3) * 0.1 : 0.31 + (i % 4) * 0.05).toFixed(3),
      snrDb: +(noisy ? 6.4 + (i % 3) : 13.2 + (i % 5)).toFixed(1),
      bandEnergy: +(noisy ? 0.31 : 0.64).toFixed(2),
      dualMicConfirmed: noisy ? (i % 3 === 0 ? 1 : 0) : 1,
    };
  }

  return {
    scenario,
    device: st,

    async connect() {
      st.link = 'connecting';
      await new Promise((r) => setTimeout(r, 500));
      if (scenario === 'link_fail') {
        st.link = 'failed';
        const e = new Error('센서 데이터를 받지 못했습니다. Bluetooth 연결과 배터리를 확인하세요.');
        e.code = 'LINK_FAILED';
        throw e;
      }
      st.link = 'connected';
      return { ...st };
    },

    getStatus() { return { ...st, dataSource: DEMO }; },

    /** 측정 시작. onTick(state) 이 1초마다 호출된다. */
    startSession(onTick) {
      elapsed = 0;
      events = [];
      timer = setInterval(() => {
        elapsed += 1;
        // 문헌 참고선(건조 토마토 35.4회/시간)에 맞춘 밀도 — 데모용이다
        const rate = st.noise === 'high' ? 120 : 36;
        if (Math.random() < rate / 3600) events.push(makeEvent(events.length));
        onTick({
          elapsedS: elapsed,
          events: events.slice(),
          recentCount: events.filter((e) => elapsed - e.t <= 60).length,
          env: envSnapshot(),
          noise: st.noise,
          link: st.link,
          receiving: st.link === 'connected',
        });
      }, 1000);
    },

    stopSession() {
      if (timer) clearInterval(timer);
      timer = null;
      const confirmed = events.filter((e) => e.dualMicConfirmed === 1);
      const avg = (k) => (confirmed.length
        ? +(confirmed.reduce((s, e) => s + e[k], 0) / confirmed.length).toFixed(2)
        : undefined);
      /** @type {MeasurementSession} */
      const session = {
        sessionId: 'S-DEMO-' + Date.now().toString(36).toUpperCase(),
        plantId: st.plantId,
        species: st.species,
        timestamp: new Date().toISOString(),
        deviceId: st.deviceId,
        firmwareVersion: st.firmwareVersion,
        calibrationStatus: st.calibrationValidUntil >= iso(0) ? 'valid' : 'expired',
        qualityStatus: !st.envOk ? 'invalid' : (st.noise === 'high' ? 'low' : 'good'),
        ultrasound: {
          eventCount: confirmed.length,
          eventCountAll: events.length,
          peakFrequencyHz: avg('peakFrequencyHz'),
          bandEnergy: avg('bandEnergy'),
          durationMs: avg('durationMs'),
          snrDb: avg('snrDb'),
          sampleRateHz: st.sampleRateHz,
        },
        environment: envSnapshot(),
        _meta: {
          elapsedS: elapsed, distanceCm: st.distanceCm, noise: st.noise,
          timeSynced: st.timeSynced, micOk: st.micOk, envOk: st.envOk,
          rawOnDevice: true, dataSource: DEMO,
        },
      };
      return session;
    },
  };
}

    note: '외부 공개 데이터(Khait et al. 2023, CC0)로 분석 방법만 확인했습니다. ' +
          '남의 장비로 녹음된 것이라 우리 측정의 기준으로 쓸 수 없습니다.',
    link: 'https://doi.org/10.1016/j.cell.2023.03.009',
  },
};

/**
 * 3층 기준이 있는지 확인한다.
 * @returns {{ok:boolean, reasons:string[]}}
 */
function researchReferenceAvailable(species) {
  if (!RESEARCH_REFERENCE.available) {
    return { ok: false, reasons: RESEARCH_REFERENCE.whyEmpty };
  }
  if (!RESEARCH_REFERENCE.validatedSpecies.includes(species)) {
    return { ok: false, reasons: ['이 종에 대해 검증된 기준 데이터가 없습니다.'] };
  }
  return { ok: true, reasons: [] };
}

/**
 * 검증 게이트 — 결과를 보여주기 전에 반드시 통과해야 하는 순서.
 *
 *   센서 연결 정상? → 보정 유효? → 환경값 수신 정상? → 배경 잡음 허용 범위?
 *   → 지원 식물/조건 범위? → 충분한 측정 시간과 이벤트 수?
 *   → 기준 데이터와 비교 가능?  → 결과 표시 또는 재측정 안내
 *
 * ★ 하나라도 실패하면 해석(모델/규칙 추론)을 표시하지 않는다 ★
 * 나쁜 데이터로 추론한 뒤 신뢰도를 낮추는 것이 아니라, 아예 추론하지 않는다.
 */

/**
 * 측정 전 점검 (Preflight).
 * @returns {{items:Array, allPass:boolean}}
 */
function preflight(device) {
  const d = device;
  const items = [
    {
      key: 'species', label: '지원 식물 종',
      pass: ENVIRONMENT_REFERENCE.supportedSpecies.includes(d.species),
      detail: d.speciesLabel + ' (' + d.species + ')',
      failHint: '현재 이 식물은 검증된 적용 범위 밖입니다. 결과는 참고용으로만 확인하세요.',
    },
    {
      key: 'calibration', label: '보정 유효기간',
      pass: d.calibrationValidUntil >= new Date().toISOString().slice(0, 10),
      detail: '마지막 보정 ' + d.calibratedAt + ' · 유효 ' + d.calibrationValidUntil,
      failHint: '보정이 만료되었습니다. 기준 신호로 센서를 확인하세요.',
    },
    {
      key: 'distance', label: '측정 거리',
      pass: d.distanceCm >= DEVICE_REFERENCE.distanceCmRange[0]
            && d.distanceCm <= DEVICE_REFERENCE.distanceCmRange[1],
      detail: d.distanceCm.toFixed(1) + ' cm',
      failHint: '식물 줄기에서 권장 거리 내에 센서를 고정하세요.',
    },
    {
      key: 'noise', label: '배경 잡음 수준',
      pass: d.noise !== 'high',
      detail: { low: '낮음', medium: '보통', high: '높음' }[d.noise],
      failHint: '팬·펌프·초음파 가습기 등 주변 장비를 멈추고 다시 측정하세요.',
    },
    {
      key: 'env', label: '환경 센서 수신',
      pass: d.envOk,
      detail: d.envOk ? '토양수분·온도·습도·조도 수신 중' : '응답 없음',
      failHint: '센서 데이터를 받지 못했습니다. 연결 상태와 배터리를 확인하세요.',
    },
    {
      key: 'sampling', label: '초음파 샘플링 설정',
      pass: d.sampleRateHz >= DEVICE_REFERENCE.minSampleRateHz,
      detail: (d.sampleRateHz / 1000).toFixed(0) + ' kHz · 마이크 ' + d.micChannels + '채널',
      failHint: '샘플링레이트가 낮아 목표 대역을 담을 수 없습니다.',
    },
    {
      key: 'time', label: '장치 시간 동기화',
      pass: d.timeSynced,
      detail: d.timeSynced ? '동기화됨' : '동기화 안 됨',
      failHint: '장치 시간이 맞지 않으면 측정값을 환경 기록과 연결할 수 없습니다.',
    },
  ];
  return { items, allPass: items.every((i) => i.pass) };
}

/**
 * 측정 후 검증 게이트.
 * @param {import('./measure-types.js').MeasurementSession} session
 * @returns {{status:string, failures:string[], passed:Array, canInterpret:boolean}}
 */
function validate(session) {
  const m = session._meta || {};
  const steps = [];
  const push = (label, pass, hint) => steps.push({ label, pass, hint });

  push('센서 연결 정상', m.micOk !== false && m.envOk !== false,
       '센서 데이터를 받지 못했습니다. 연결 상태와 배터리를 확인하세요.');
  push('보정 유효', session.calibrationStatus === 'valid',
       '보정이 만료되었습니다. 기준 신호로 센서를 확인하세요.');
  push('환경값 수신 정상', session.environment.soilMoisture !== null
       && session.environment.soilMoisture !== undefined,
       '환경값이 없으면 초음파만으로 해석하지 않습니다.');
  push('배경 잡음 허용 범위', m.noise !== 'high',
       '주변 잡음 또는 데이터 품질 문제로 결과를 해석하기 어렵습니다.');
  push('지원 식물·조건 범위', ENVIRONMENT_REFERENCE.supportedSpecies.includes(session.species),
       '현재 이 식물 또는 조건은 검증된 적용 범위 밖입니다.');
  push('충분한 측정 시간', (m.elapsedS || 0) >= DEVICE_REFERENCE.minSessionSeconds,
       '측정 시간이 짧아 판단하기 어렵습니다. 더 길게 측정하세요.');

  const ref = researchReferenceAvailable(session.species);
  push('기준 데이터와 비교 가능', ref.ok,
       '현재 조건과 비교할 검증 데이터가 충분하지 않습니다.');

  const failures = steps.filter((s) => !s.pass);

  let status = 'measurable';
  if (m.micOk === false || m.envOk === false) status = 'sensor_check';
  else if (session.calibrationStatus !== 'valid') status = 'calibration';
  else if (m.noise === 'high') status = 'remeasure';
  else if (!ENVIRONMENT_REFERENCE.supportedSpecies.includes(session.species))
    status = 'out_of_scope';
  else if ((m.elapsedS || 0) < DEVICE_REFERENCE.minSessionSeconds) status = 'remeasure';
  else if (!ref.ok) status = 'no_reference';

  return {
    status,
    steps,
    failures: failures.map((f) => f.hint),
    // ★ 해석은 모든 게이트를 통과했을 때만 ★
    canInterpret: failures.length === 0,
    referenceReasons: ref.reasons,
  };
}

/** 상태에 맞는 점검 안내를 고른다 */
function checklistFor(status) {
  if (status === 'sensor_check') return 'sensor_error';
  if (status === 'remeasure') return 'quality_low';
  return 'water_pattern';
}

function trendChart(points) {
  if (!points || !points.length) {
    return `<aside class="trend"><div class="section-head">
      <h3>초음파 이벤트 추세</h3></div>
      <p class="muted small">표시할 데이터가 없습니다.</p></aside>`;
  }
  const w = 360, h = 132, padL = 30, padB = 22, padT = 10;
  const max = Math.max(...points.map((p) => p.v)) * 1.15 || 1;
  const bw = (w - padL - 10) / points.length;

  const bars = points.map((p, i) => {
    const bh = (p.v / max) * (h - padT - padB);
    const x = padL + i * bw + bw * 0.18;
    const y = h - padB - bh;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw * 0.64).toFixed(1)}"
      height="${Math.max(bh, 1).toFixed(1)}" rx="2" class="bar"><title>${esc(p.t)}시 · ${p.v} 회/시간</title></rect>`;
  }).join('');

  const labels = points.map((p, i) => (i % 2 === 0
    ? `<text x="${(padL + i * bw + bw / 2).toFixed(1)}" y="${h - 7}" class="axis"
        text-anchor="middle">${esc(p.t)}</text>` : '')).join('');

  return `
<aside class="trend" aria-labelledby="trendTitle">
  <div class="section-head trend-head">
    <h3 id="trendTitle">초음파 이벤트 추세</h3>
    <span class="demo-tag demo-tag-light">데모 데이터</span>
  </div>
  <svg viewBox="0 0 ${w} ${h}" class="trend-svg" role="img"

function detectionCurveChart(points) {
  const w = 620, h = 170, padL = 46, padR = 14, padB = 32, padT = 12;
  const pw = w - padL - padR, ph = h - padT - padB;
  const xs = points.map((p) => p.gainDb);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const X = (g) => padL + ((g - minX) / (maxX - minX)) * pw;
  const Y = (r) => padT + ph - r * ph;

  const line = points.map((p) => `${X(p.gainDb).toFixed(1)},${Y(p.recall).toFixed(1)}`).join(' ');
  const area = `${padL},${padT + ph} ${line} ${X(maxX).toFixed(1)},${padT + ph}`;
  const dots = points.map((p) =>
    `<circle cx="${X(p.gainDb).toFixed(1)}" cy="${Y(p.recall).toFixed(1)}" r="3.4"
       class="pt"><title>감쇠 ${p.gainDb} dB · 재현율 ${p.recall.toFixed(2)}</title></circle>`).join('');
  const xlab = points.map((p) =>
    `<text x="${X(p.gainDb).toFixed(1)}" y="${h - 10}" class="axis" text-anchor="middle">${p.gainDb}</text>`).join('');
  const grid = [0, 0.5, 1].map((r) =>
    `<line x1="${padL}" y1="${Y(r).toFixed(1)}" x2="${w - padR}" y2="${Y(r).toFixed(1)}" class="grid"/>
     <text x="${padL - 8}" y="${(Y(r) + 4).toFixed(1)}" class="axis" text-anchor="end">${r.toFixed(1)}</text>`).join('');

  return `
<div class="chartbox">
  <svg viewBox="0 0 ${w} ${h}" class="curve" role="img"
       aria-label="이벤트 세기 감쇠에 따른 검출 재현율 곡선. 0 dB에서 1.00, -42 dB에서 0.00.">
    ${grid}
    <polygon points="${area}" class="curve-area"/>
    <polyline points="${line}" class="curve-line"/>
    <line x1="${padL}" y1="${Y(0.5).toFixed(1)}" x2="${w - padR}" y2="${Y(0.5).toFixed(1)}" class="ref"/>
    ${dots}${xlab}
    <text x="${padL}" y="${padT + 8}" class="axis">재현율</text>
    <text x="${w - padR}" y="${h - 10}" class="axis" text-anchor="end">감쇠(dB)</text>
  </svg>
  <p class="trend-note">실제 토마토 녹음을 감쇠시키며 측정. 점선은 50% 기준선.
    이벤트 밀도는 통계 확보를 위해 올린 값이며 문헌 방출률이 아닙니다.</p>
</div>`;
}

function liveMeasurementPanel(s, running) {

  const env = s.env || {};
  const mm = String(Math.floor(s.elapsedS / 60)).padStart(2, '0');
  const ss = String(s.elapsedS % 60).padStart(2, '0');

/* ===== src/measure.js ===== */
/**
 * 측정 흐름 컨트롤러.
 *
 *   연결 → 측정 전 점검 → 실시간 측정 → 검증 게이트 → 결과(A/B/C)
 *
 * ★ 3층 기준 데이터가 비어 있으므로 해석(B)은 항상 "기준 데이터 부족"이다 ★
 *   이것은 결함이 아니라 현재 상태를 정직하게 반영한 것이다.
 */



const state = {
  scenario: 'normal',
  device: createMockDevice('normal'),
  link: 'disconnected',
  error: null,
  live: null,
  running: false,
  session: null,
  validation: null,
  history: [],
};

let mount = null;

function renderMeasure(container) {
  mount = container;
  paint();
}

function paint() {
  const d = state.device.device;
  const parts = [`
    <div class="section-head">
      <h2>측정하기</h2>
      <p class="section-sub">식물환자 초음파 센서로 측정하고, 데이터 품질을 확인한 뒤
        <b>점검 우선순위</b>를 안내합니다. 식물 상태를 확정하는 화면이 아닙니다.</p>
    </div>`];

  parts.push(scenarioPicker(state.scenario));
  parts.push(sensorConnectionPanel(d, state.link, state.error));

  if (state.link === 'connected') {
    parts.push(preflightQualityCheck(preflight(d)));
  }
  if (state.live || state.running) {
    parts.push(liveMeasurementPanel(state.live || {
      elapsedS: 0, events: [], recentCount: 0, env: {},
      noise: d.noise, link: state.link, receiving: false,
    }, state.running));
  }
  if (state.session && state.validation) {
    const v = state.validation;
    parts.push(validationGatePanel(v));
    parts.push(evidenceSummary(state.session, v));
    parts.push(comparisonResult(v));
    parts.push(inspectionChecklist(checklistFor(v.status)));
    if (!v.canInterpret) parts.push(rescanGuide());
  }

  parts.push(referenceDataStatus());
  parts.push(measurementHistory(state.history));
  parts.push(measurementHelp());

  mount.innerHTML = `<div class="measure">${parts.join('')}</div>`;
  wire();
}

function wire() {
  document.querySelectorAll('[data-scenario]').forEach((b) =>
    b.addEventListener('click', () => {
      state.scenario = b.dataset.scenario;
      state.device = createMockDevice(state.scenario);
      state.link = 'disconnected';
      state.error = null;
      state.live = null;
      state.running = false;
      state.session = null;
      state.validation = null;
      paint();
    }));

  const c = document.getElementById('btnConnect');
  if (c) c.addEventListener('click', async () => {
    state.link = 'connecting';
    state.error = null;
    paint();
    try {
      await state.device.connect();
      state.link = 'connected';
    } catch (e) {
      state.link = 'failed';
      state.error = e.message;
    }
    paint();
  });

  const s = document.getElementById('btnStart');
  if (s) s.addEventListener('click', () => {
    state.running = true;
    state.session = null;
    state.validation = null;
    state.device.startSession((live) => {
      state.live = live;
      // 측정 중에는 실시간 패널만 갱신해 화면 깜빡임을 줄인다
      const panel = document.querySelector('.measure');
      if (panel) paint();
      if (live.elapsedS >= 25) stopNow();     // 데모: 25초 후 자동 종료
    });
    paint();
  });

  const st = document.getElementById('btnStop');
  if (st) st.addEventListener('click', stopNow);

  const r = document.getElementById('btnRestart');
  if (r) r.addEventListener('click', () => {
    state.live = null; state.running = false;
    state.session = null; state.validation = null;
    paint();
  });
}

function stopNow() {
  if (!state.running) return;
  state.running = false;
  const session = state.device.stopSession();
  const v = validate(session);
  session._status = v.status;
  state.session = session;
  state.validation = v;
  state.history.push(session);
  paint();
}


/* ===== 단독 실행 부트스트랩 (공유용) ===== */
const root = document.getElementById('root');
const SNAP = { ready: snapshot, empty: emptySnapshot };

function shell(main){
  root.innerHTML = nav() + '<main id="main" class="wrap" tabindex="-1">' + main + '</main>' + footer() + switcher();
  wire();
}
function switcher(){
  return `<div class="statebar" role="group" aria-label="데모 상태 전환">
    <span class="statebar-label">데모 상태</span>
    ${['정상','로딩','데이터 없음','오류'].map((l,i)=>
      `<button type="button" class="statebtn${i===0?' is-on':''}" data-state="${['ready','loading','empty','error'][i]}">${l}</button>`).join('')}
  </div>`;
}
function wire(){
  const t = document.getElementById('navToggle'), m = document.getElementById('navMenu');
  if (t && m) t.addEventListener('click', () => {
    const open = m.classList.toggle('is-open');
    t.setAttribute('aria-expanded', String(open));
    t.setAttribute('aria-label', open ? '메뉴 닫기' : '메뉴 열기');
  });
  const rep = document.getElementById('btnReport');
  if (rep) rep.addEventListener('click', () => {
    const b = document.getElementById('reportNote');
    if (b) { b.hidden = false; b.focus(); }
  });
  document.querySelectorAll('.statebtn').forEach(b =>
    b.addEventListener('click', () => render(b.dataset.state)));
  document.querySelectorAll('.nav-view').forEach(b =>
    b.addEventListener('click', () => {
      const main = document.getElementById('main');
      if (main) { main.innerHTML = ''; renderMeasure(main); main.focus(); }
    }));
  const retry = document.getElementById('btnRetry');
  if (retry) retry.addEventListener('click', () => render('ready'));
}
function render(state){
  if (state === 'loading') { shell(loadingState()); mark(state); return; }
  if (state === 'error') { shell(errorState('측정 서버에 연결하지 못했습니다.')); mark(state); return; }
  const s = SNAP[state === 'empty' ? 'empty' : 'ready'];
  shell([
    hero(s.facility), metrics(s.facility.metrics),
    s.plants.length ? plantTable(s.plants) : emptyState(),
    alertPanel(s.alerts, s.trend),
    validationPanel(validation),
    '<div class="report-note" id="reportNote" tabindex="-1" hidden role="status">운영 보고서 내보내기는 아직 연결되지 않았습니다. 현재 화면의 수치는 데모 데이터이므로 보고서로 내보내지 않습니다.</div>'
  ].join(''));
  mark(state);
}
function mark(state){
  document.querySelectorAll('.statebtn').forEach(b =>
    b.classList.toggle('is-on', b.dataset.state === state));
}
render('ready');
</script>
